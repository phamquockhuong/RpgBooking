<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/user-layout :: layout(~{:: #boxPayment})}">
<body>

<div id="boxPayment" class="container mt-5">

    <div class="row">

        <!-- SUMMARY -->
        <div class="col-md-5">

            <div class="card p-4 bg-custom-card text-white">
                <h4>Thông tin booking</h4>

                <p>Phòng: <strong th:text="${booking.room.name}"></strong></p>
                <p>Ngày: <strong th:text="${booking.bookingDate}"></strong></p>
                <p>Giờ: <strong th:text="${booking.startTime}"></strong></p>
                <p>Người lớn: <strong th:text="${booking.numAdult}"></strong></p>
                <p>Trẻ em: <strong th:text="${booking.numKid}"></strong></p>
            </div>

        </div>

        <!-- PAYMENT -->
        <div class="col-md-7">

            <form th:action="@{/booking/confirm-payment}" method="post"
                  class="card p-4 bg-custom-card text-white">

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />
                <input type="hidden" name="bookingId" th:value="${booking.id}"/>

                <!-- VOUCHER -->
                <div class="mb-3">
                    <label>🎟 Voucher</label>
                    <div class="input-group">
                        <input type="text" name="voucherCode" class="form-control">
                        <button type="button" class="btn btn-info">Áp dụng</button>
                    </div>
                </div>

                <!-- TOTAL -->
                <div class="card p-3 bg-dark text-white">
                    <p>Giá gốc: <span th:text="${price}"></span></p>
                    <p>Thuế: <span th:text="${tax}"></span></p>
                    <p>Giảm giá: <span th:text="${discount}"></span></p>

                    <hr>

                    <h4>Tổng: <span th:text="${total}"></span></h4>
                </div>

                <!-- PAY -->
                <button class="btn btn-success w-100 mt-3">
                    Thanh toán
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
