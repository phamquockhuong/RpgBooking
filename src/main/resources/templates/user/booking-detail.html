<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/user-layout :: layout(~{:: #boxBookingDetail})}">
<body>

<div id="boxBookingDetail" class="container mt-5">
    <div class="row">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <img th:src="${room.imageUrl}" class="card-img-top" alt="Room Image">
                <h2 class="mt-3" th:text="${room.name}">Tên phòng</h2>
                <p>Mô tả: <span th:text="${room.description}"></span></p>
                <ul class="list-unstyled">
                    <li>
                        Số người: <strong th:text="${room.minPlayers} + ' - ' + ${room.maxPlayers}"></strong> người</li>
                    <li>
                        Thời gian chơi: <strong th:text="${room.duration}"></strong> phút
                    </li>
                    <li>
                        Giá người lớn:
                        <strong id="priceAdult" th:text="${#numbers.formatDecimal(room.priceAdult, 0, 'POINT', 0, 'POINT')}"></strong> VNĐ
                    </li>
                    <li>
                        Giá trẻ em:
                        <strong id="priceKid" th:text="${#numbers.formatDecimal(room.priceKid, 0, 'POINT', 0, 'POINT')}"></strong> VNĐ
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-md-7">
            <form th:action="@{/confirm-booking}" th:object="${bookingRequest}" method="POST" class="card p-4">
                <input type="hidden" th:field="*{roomId}" th:value="${room.id}" />
                <input type="hidden" id="roomDuration" th:value="${room.duration}" />

                <div class="mb-3">
                    <label>Chọn ngày chơi:</label>
                    <input type="date" id="bookingDate" th:field="*{bookingDate}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Chọn giờ bắt đầu:</label>
                    <select id="startTimeSelect" th:field="*{startTime}" class="form-control" onchange="calculateTotal()">
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Số người lớn (≥1):</label>
                        <input type="number" id="numAdult" th:field="*{numAdult}" class="form-control" value="1" min="1" oninput="calculateTotal()">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Số trẻ em (≥1):</label>
                        <input type="number" id="numKid" th:field="*{numKid}" class="form-control" value="1" min="1" oninput="calculateTotal()">
                    </div>
                </div>

                <div class="input-group mb-3">
                    <input type="text" id="voucherInput" th:field="*{voucherCode}" class="form-control" placeholder="Mã giảm giá">
                    <button type="button" class="btn btn-outline-secondary" onclick="applyVoucher()">Áp dụng</button>
                </div>

                <div class="card p-3 bg-light">
                    <p>Giá gốc: <span id="basePrice">0</span> VNĐ</p>
                    <p>Thuế (GST 10%): <span id="gstAmount">0</span> VNĐ</p>
                    <p>Giảm giá: <span id="discountAmount">0</span> VNĐ</p>
                    <hr>
                    <h4>Tổng cộng: <span id="finalTotal">0</span> VNĐ</h4>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Xác nhận đặt phòng</button>
            </form>
        </div>
    </div>
</div>
<th:block th:fragment="page-scripts">
    <script src="/js/booking.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
