<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/user-layout :: layout(~{:: #boxBookingDetail})}">
<body>

<div id="boxBookingDetail" class="container mt-5">
    <div class="row">

        <!-- ROOM INFO -->
        <div class="col-md-5">
            <div class="card p-4 shadow-sm bg-custom-card text-white border-0">
                <img th:src="${room.imageUrl}" class="card-img-top rounded-3">

                <h2 class="mt-3 fw-bold" th:text="${room.name}"></h2>

                <p th:text="${room.description}"></p>

                <ul class="list-unstyled">
                    <li>👥 <strong th:text="${room.minPlayers} + ' - ' + ${room.maxPlayers}"></strong> người</li>
                    <li>⏱️ <strong th:text="${room.duration}"></strong> phút</li>
                    <li>💰 Giá người lớn: <strong th:text="${room.priceAdult}"></strong></li>
                    <li>🧒 Giá trẻ em: <strong th:text="${room.priceKid}"></strong></li>
                </ul>
            </div>
        </div>

        <!-- BOOKING FORM -->
        <div class="col-lg-7">

            <div class="card border-0 shadow-lg bg-dark text-white p-4">

                <h4 class="fw-bold mb-4">📝 Thông tin đặt phòng</h4>

                <form th:action="@{/booking/create}" method="post">

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show fw-bold mb-3" role="alert">
                        <span th:text="${errorMessage}">Nội dung thông báo lỗi sẽ tự động hiển thị ở đây</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- CSRF -->
                    <input type="hidden"
                           th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <input type="hidden" name="roomId" id="roomId" th:value="${room.id}"/>
                    <input type="hidden" id="roomDuration" th:value="${room.duration}" />

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label class="form-label">📧 Email</label>

                        <!-- LOGGED IN -->
                        <input type="email"
                               th:if="${#authentication != null and #authentication.name != 'anonymousUser'}"
                               class="form-control form-control-lg"
                               th:value="${#authentication.name}"
                               readonly>

                        <!-- NOT LOGGED IN -->
                        <input type="email"
                               th:if="${#authentication == null or #authentication.name == 'anonymousUser'}"
                               name="email"
                               class="form-control form-control-lg"
                               placeholder="Nhập email của bạn"
                               required>
                    </div>

                    <!-- DATE -->
                    <div class="mb-3">
                        <label class="form-label">📅 Chọn ngày</label>
                        <input type="date" name="bookingDate" id="bookingDate"
                               class="form-control form-control-lg"
                               required>
                    </div>

                    <!-- TIME -->
                    <div class="mb-3">
                        <label class="form-label">🕒 Giờ bắt đầu</label>
                        <select name="startTime" id="startTimeSelect"
                                class="form-control form-control-lg" required>
                        </select>
                    </div>

                    <!-- PEOPLE -->
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">👨 Người lớn</label>
                            <input type="number"
                                   name="numAdult"
                                   class="form-control form-control-lg"
                                   required
                                   min="1"
                                   value="1">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">🧒 Trẻ em</label>
                            <input type="number"
                                   name="numKid"
                                   class="form-control form-control-lg"
                                   required
                                   min="1"
                                   value="1">
                        </div>

                    </div>

                    <!-- BUTTON -->
                    <button type="submit"
                            class="btn btn-primary btn-lg w-100 mt-4 fw-bold">
                        Tiếp tục thanh toán →
                    </button>

                </form>

            </div>

            <!-- NOTE -->
            <div class="text-white-50 mt-3 small">
                * Bạn sẽ chuyển sang bước thanh toán sau khi xác nhận thông tin
            </div>

        </div>
    </div>
</div>
<th:block th:fragment="page-scripts">
    <script src="/js/booking.js"></script>
</th:block>
</body>
</html>
