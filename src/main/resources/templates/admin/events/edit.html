<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Chỉnh sửa sự kiện</h3>
                </div>

                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a th:href="@{/admin/dashboard}">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Chỉnh sửa sự kiện
                        </li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="app-content">

            <form th:action="@{/admin/events/edit/{id}(id=${event.id})}"
                  th:object="${event}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Tên sự kiện <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Hệ số giá <span class="text-danger">*</span>
                        </label>

                        <input type="number"
                               step="0.01"
                               min="0"
                               th:field="*{priceMultiplier}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Ngày bắt đầu <span class="text-danger">*</span>
                        </label>

                        <input type="date"
                               name="startDate"
                               th:value="${event.startDate != null ? #temporals.format(event.startDate,'yyyy-MM-dd') : ''}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Ngày kết thúc <span class="text-danger">*</span>
                        </label>

                        <input type="date"
                               name="endDate"
                               th:classappend="${#fields.hasErrors('endDate')} ? ' is-invalid'"
                               th:value="${event.endDate != null ? #temporals.format(event.endDate,'yyyy-MM-dd') : ''}"
                               class="form-control"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('endDate')}"
                             th:errors="*{endDate}">
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{active}">

                            <label class="form-check-label">
                                Kích hoạt sự kiện
                            </label>
                        </div>
                    </div>

                </div>

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}"
                       th:text="${err}">
                    </p>
                </div>

                <div class="mt-3 text-end">

                    <a th:href="@{/admin/events}"
                       class="btn btn-secondary">
                        Quay lại
                    </a>

                    <button type="submit"
                            class="btn btn-warning px-4">
                        Cập nhật
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
</body>
</html>
