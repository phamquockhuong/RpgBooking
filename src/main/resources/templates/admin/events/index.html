<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Danh sách sự kiện</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a href="/admin/dashboard">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Thêm sự kiện
                        </li>
                    </ol>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/admin/events/add}"
                   class="btn btn-primary">
                    + Danh sách sự kiện
                </a>

                <div class="col-md-3">
                    <form th:action="@{/admin/events}" method="GET">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập thông tin cần tìm...">
                            <button type="submit" class="btn btn-secondary"><i class="bi bi-search"></i> Tìm kiếm</button>
                            <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/admin/events}" class="btn btn-outline-danger">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="app-content">

            <table class="table table-hover table-bordered align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Hệ số giá</th>
                    <th>Từ ngày</th>
                    <th>Đến ngày</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${eventPage.empty}">
                    <td colspan="7" class="text-center">
                        Chưa có dữ liệu
                    </td>
                </tr>

                <tr th:each="event : ${eventPage.content}">
                    <td th:text="${event.id}"></td>

                    <td th:text="${event.name}"></td>

                    <td th:text="${event.priceMultiplier}"></td>

                    <td th:text="${#temporals.format(event.startDate,'dd/MM/yyyy')}"></td>

                    <td th:text="${#temporals.format(event.endDate,'dd/MM/yyyy')}"></td>

                    <td>
            <span th:if="${event.active}"
                  class="badge bg-success">
                Hoạt động
            </span>

                        <span th:unless="${event.active}"
                              class="badge bg-danger">
                Tắt
            </span>
                    </td>

                    <td>

                        <a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
                           class="btn btn-warning btn-sm">
                            Sửa
                        </a>

                        <form th:action="@{/admin/events/delete/{id}(id=${event.id})}"
                              method="post"
                              style="display:inline">

                            <button class="btn btn-danger btn-sm"
                                    onclick="return confirm('Xóa sự kiện?')">
                                Xóa
                            </button>

                        </form>

                    </td>
                </tr>

                </tbody>
            </table>

            <nav class="mt-3" th:if="${eventPage.totalPages > 0}">
                <ul class="pagination">

                    <li class="page-item"
                        th:classappend="${eventPage.first} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/room-blocks(page=${eventPage.number - 1})}">
                            Trước
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, eventPage.totalPages - 1)}"
                        th:classappend="${i == eventPage.number} ? 'active'">

                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/admin/room-blocks(page=${i})}">
                        </a>

                    </li>

                    <li class="page-item"
                        th:classappend="${eventPage.last} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/room-blocks(page=${eventPage.number + 1})}">
                            Sau
                        </a>

                    </li>

                </ul>
            </nav>

        </div>
    </div>

</div>
</body>
</html>
