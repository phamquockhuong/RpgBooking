<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Quản lý Hỏi & Đáp (FAQ)</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a href="/admin/dashboard">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Danh sách FAQ
                        </li>
                    </ol>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/admin/faqs/add}"
                   class="btn btn-primary">
                    + Thêm câu hỏi
                </a>

                <div class="col-md-4">
                    <form th:action="@{/admin/faqs}" method="GET">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo nội dung câu hỏi...">
                            <button type="submit" class="btn btn-secondary"><i class="bi bi-search"></i> Tìm kiếm</button>
                            <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/admin/faqs}" class="btn btn-outline-danger">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="app-content">

            <table class="table table-hover table-bordered align-middle">
                <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Câu hỏi</th>
                    <th>Câu trả lời</th>
                    <th style="width: 100px;">Thứ tự (Level)</th>
                    <th style="width: 130px;">Trạng thái</th>
                    <th style="width: 150px;">Hành động</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${faqPage.empty}">
                    <td colspan="6" class="text-center text-muted py-3">
                        Chưa có dữ liệu câu hỏi nào phù hợp
                    </td>
                </tr>

                <tr th:each="faq : ${faqPage.content}">
                    <td th:text="${faq.id}"></td>

                    <td>
                        <strong th:text="${faq.question}"></strong>
                    </td>

                    <td th:text="${faq.answer}"></td>

                    <td class="text-center" th:text="${faq.level}"></td>

                    <td>
                        <span th:if="${faq.active}" class="badge bg-success">
                            Hiển thị
                        </span>
                        <span th:unless="${faq.active}" class="badge bg-danger">
                            Ẩn
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/admin/faqs/edit/{id}(id=${faq.id})}"
                           class="btn btn-warning btn-sm">
                            Sửa
                        </a>

                        <form th:action="@{/admin/faqs/delete/{id}(id=${faq.id})}"
                              method="post"
                              style="display:inline">
                            <button class="btn btn-danger btn-sm"
                                    onclick="return confirm('Bạn có chắc chắn muốn xóa câu hỏi này?')">
                                Xóa
                            </button>
                        </form>
                    </td>
                </tr>

                </tbody>
            </table>

            <nav class="mt-3" th:if="${faqPage.totalPages > 0}">
                <ul class="pagination">

                    <li class="page-item"
                        th:classappend="${faqPage.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/faqs(page=${faqPage.number - 1}, keyword=${keyword})}">
                            Trước
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, faqPage.totalPages - 1)}"
                        th:classappend="${i == faqPage.number} ? 'active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/admin/faqs(page=${i}, keyword=${keyword})}">
                        </a>
                    </li>

                    <li class="page-item"
                        th:classappend="${faqPage.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/faqs(page=${faqPage.number + 1}, keyword=${keyword})}">
                            Sau
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>

</div>
</body>
</html>
