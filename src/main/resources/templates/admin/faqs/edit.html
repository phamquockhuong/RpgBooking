<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Chỉnh sửa câu hỏi (FAQ)</h3>
                </div>

                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a th:href="@{/admin/dashboard}">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Chỉnh sửa FAQ
                        </li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="app-content">

            <form th:action="@{/admin/faqs/edit/{id}(id=${faq.id})}"
                  th:object="${faq}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-9 mb-3">
                        <label class="form-label">
                            Nội dung Câu hỏi <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               th:field="*{question}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('question')} ? ' is-invalid'"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('question')}"
                             th:errors="*{question}">
                        </div>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">
                            Thứ tự hiển thị (Level) <span class="text-danger">*</span>
                        </label>

                        <input type="number"
                               min="1"
                               th:field="*{level}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">
                            Nội dung Câu trả lời <span class="text-danger">*</span>
                        </label>

                        <textarea th:field="*{answer}"
                                  class="form-control"
                                  rows="6"
                                  th:classappend="${#fields.hasErrors('answer')} ? ' is-invalid'"
                                  required></textarea>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('answer')}"
                             th:errors="*{answer}">
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{active}">

                            <label class="form-check-label">
                                Hiển thị câu hỏi này trên giao diện người dùng
                            </label>
                        </div>
                    </div>

                </div>

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}"
                       th:text="${err}">
                    </p>
                </div>

                <div class="mt-3 text-end">

                    <a th:href="@{/admin/faqs}"
                       class="btn btn-secondary">
                        Quay lại
                    </a>

                    <button type="submit"
                            class="btn btn-warning px-4">
                        Cập nhật
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
</body>
</html>
