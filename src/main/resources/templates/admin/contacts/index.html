<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Quản lý thư liên hệ</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">Home</a></li>
                        <li class="breadcrumb-item active">Danh sách liên hệ</li>
                    </ol>
                </div>
            </div>

            <div class="row mt-3 justify-content-end">
                <div class="col-md-4">
                    <form th:action="@{/admin/contacts}" method="GET">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                   placeholder="Tìm theo tên hoặc nội dung thư...">
                            <button type="submit" class="btn btn-secondary"><i class="bi bi-search"></i> Tìm</button>
                            <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/admin/contacts}" class="btn btn-outline-danger">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-2" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="app-content mt-3">
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th style="width: 180px;">Họ tên</th>
                    <th style="width: 200px;">Email</th>
                    <th>Nội dung liên hệ</th>
                    <th style="width: 140px;" class="text-center">Trạng thái</th>
                    <th style="width: 220px;" class="text-center">Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${contactPage.empty}">
                    <td colspan="6" class="text-center text-muted py-3">Chưa có thư liên hệ nào phù hợp</td>
                </tr>

                <tr th:each="contact : ${contactPage.content}">
                    <td th:text="${contact.id}"></td>
                    <td th:text="${contact.name}"></td>
                    <td>
                        <a th:href="'mailto:' + ${contact.email}" th:text="${contact.email}"></a>
                    </td>
                    <td th:text="${contact.content}"></td>
                    <td class="text-center">
                        <span th:if="${contact.active}" class="badge bg-success">Đã xử lý</span>
                        <span th:unless="${contact.active}" class="badge bg-warning text-dark">Chưa xử lý</span>
                    </td>
                    <td class="text-center">
                        <form th:action="@{/admin/contacts/toggle-status/{id}(id=${contact.id})}"
                              method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${contact.active} ? 'btn-outline-secondary' : 'btn-info'">
                                <span th:text="${contact.active} ? 'Mở lại thư' : 'Đánh dấu đã xử lý'"></span>
                            </button>
                        </form>

                        <form th:action="@{/admin/contacts/delete/{id}(id=${contact.id})}"
                              method="post" style="display:inline">
                            <button class="btn btn-danger btn-sm"
                                    onclick="return confirm('Bạn có chắc chắn muốn xóa thư liên hệ này không?')">
                                Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <nav class="mt-3" th:if="${contactPage.totalPages > 0}">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${contactPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/contacts(page=${contactPage.number - 1}, keyword=${keyword})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, contactPage.totalPages - 1)}"
                        th:classappend="${i == contactPage.number} ? 'active'">
                        <a class="page-link" th:text="${i + 1}" th:href="@{/admin/contacts(page=${i}, keyword=${keyword})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${contactPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/contacts(page=${contactPage.number + 1}, keyword=${keyword})}">Sau</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>

</div>
</body>
</html>
