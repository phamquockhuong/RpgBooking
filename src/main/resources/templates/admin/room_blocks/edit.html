<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Chỉnh sửa lịch chặn phòng</h3>
                </div>

                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a href="/admin/dashboard">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Chỉnh sửa lịch chặn phòng
                        </li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="app-content">

            <form th:action="@{/admin/room-blocks/edit/{id}(id=${roomBlock.id})}"
                  th:object="${roomBlock}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Phòng <span class="text-danger">*</span>
                        </label>

                        <select th:field="*{room.id}"
                                class="form-select"
                                required>

                            <option value="">
                                -- Chọn phòng --
                            </option>

                            <option th:each="r : ${rooms}"
                                    th:value="${r.id}"
                                    th:text="${r.name}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Thời gian bắt đầu <span class="text-danger">*</span>
                        </label>

                        <input type="datetime-local"
                               th:name="startTime"
                               th:value="${roomBlock.startTime != null ? #temporals.format(roomBlock.startTime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Thời gian kết thúc <span class="text-danger">*</span>
                        </label>

                        <input type="datetime-local"
                               th:name="endTime"
                               th:value="${roomBlock.endTime != null ? #temporals.format(roomBlock.endTime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                               class="form-control"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('endTime')}"
                             th:errors="*{endTime}">
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">
                            Lý do chặn
                        </label>

                        <textarea th:field="*{reason}"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Nhập lý do bảo trì, vệ sinh, sự kiện riêng...">
                        </textarea>
                    </div>

                    <div class="col-md-12 mb-3">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{active}">

                            <label class="form-check-label">
                                Kích hoạt lịch chặn
                            </label>
                        </div>
                    </div>

                </div>

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">

                    <ul class="mb-0">
                        <li th:each="err : ${#fields.globalErrors()}"
                            th:text="${err}">
                        </li>
                    </ul>

                </div>

                <div class="mt-3 text-end">
                    <a th:href="@{/admin/room-blocks}"
                       class="btn btn-secondary">
                        Quay lại
                    </a>

                    <button type="submit"
                            class="btn btn-warning px-4">
                        Cập nhật thông tin
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>
</body>
</html>
