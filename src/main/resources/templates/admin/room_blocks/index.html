<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Danh sách chặn phòng</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a href="/admin/dashboard">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Danh sách chặn phòng
                        </li>
                    </ol>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/admin/room-blocks/add}"
                   class="btn btn-primary">
                    + Thêm lịch chặn phòng
                </a>

                <div class="col-md-3">
                    <form th:action="@{/admin/room-blocks}" method="GET">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập thông tin cần tìm...">
                            <button type="submit" class="btn btn-secondary"><i class="bi bi-search"></i> Tìm kiếm</button>
                            <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/admin/room-blocks}" class="btn btn-outline-danger">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="app-content">

            <table class="table table-hover table-bordered align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Phòng</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Lý do</th>
                    <th>Trạng thái</th>
                    <th width="180">Thao tác</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${roomPage.empty}">
                    <td colspan="7" class="text-center">
                        Chưa có dữ liệu
                    </td>
                </tr>

                <tr th:each="block : ${roomPage.content}">
                    <td th:text="${block.id}"></td>

                    <td th:text="${block.room != null ? block.room.name : 'N/A'}"></td>

                    <td th:text="${#temporals.format(block.startTime, 'dd/MM/yyyy HH:mm')}"></td>

                    <td th:text="${#temporals.format(block.endTime, 'dd/MM/yyyy HH:mm')}"></td>

                    <td th:text="${block.reason}"></td>

                    <td>
                        <span th:if="${block.active}"
                              class="badge bg-success">
                            Hoạt động
                        </span>

                        <span th:unless="${block.active}"
                              class="badge bg-secondary">
                            Đã tắt
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/admin/room-blocks/edit/{id}(id=${block.id})}"
                           class="btn btn-sm btn-warning">
                            Sửa
                        </a>

                        <form th:action="@{/admin/room-blocks/delete/{id}(id=${block.id})}"
                              method="post"
                              style="display:inline;">

                            <button type="submit"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('Bạn có chắc muốn xóa lịch chặn này?')">
                                Xóa
                            </button>

                        </form>
                    </td>
                </tr>

                </tbody>
            </table>

            <nav class="mt-3" th:if="${roomPage.totalPages > 0}">
                <ul class="pagination">

                    <li class="page-item"
                        th:classappend="${roomPage.first} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/room-blocks(page=${roomPage.number - 1})}">
                            Trước
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, roomPage.totalPages - 1)}"
                        th:classappend="${i == roomPage.number} ? 'active'">

                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/admin/room-blocks(page=${i})}">
                        </a>

                    </li>

                    <li class="page-item"
                        th:classappend="${roomPage.last} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/room-blocks(page=${roomPage.number + 1})}">
                            Sau
                        </a>

                    </li>

                </ul>
            </nav>

        </div>
    </div>

</div>
</body>
</html>
