<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Thêm lịch chặn phòng</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a href="/admin/dashboard">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Thêm lịch chặn phòng
                        </li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="app-content">

            <form th:action="@{/admin/room-blocks/add}"
                  th:object="${roomBlock}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Phòng</label>
                        <select th:field="*{room.id}" class="form-select" required>
                            <option value="">-- Chọn phòng --</option>
                            <option th:each="r : ${rooms}"
                                    th:value="${r.id}"
                                    th:text="${r.name}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Thời gian bắt đầu</label>
                        <input type="datetime-local"
                               th:field="*{startTime}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Thời gian kết thúc</label>

                        <input type="datetime-local"
                               th:field="*{endTime}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('endTime')} ? ' is-invalid'"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('endTime')}"
                             th:errors="*{endTime}">
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label>Lý do</label>
                        <textarea th:field="*{reason}"
                                  class="form-control"
                                  rows="4"></textarea>
                    </div>

                    <div class="col-md-12 mb-3">
                        <div class="form-check">
                            <input type="checkbox"
                                   th:field="*{active}"
                                   class="form-check-input">

                            <label class="form-check-label">
                                Kích hoạt
                            </label>
                        </div>
                    </div>

                </div>

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">

                    <ul class="mb-0">
                        <li th:each="err : ${#fields.globalErrors()}"
                            th:text="${err}">
                        </li>
                    </ul>

                </div>

                <div class="text-end">
                    <a th:href="@{/admin/room-blocks}"
                       class="btn btn-secondary">
                        Quay lại
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Thêm mới
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>
</body>
</html>
