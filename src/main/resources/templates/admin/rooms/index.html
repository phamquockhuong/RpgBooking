<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">
    <div class="container-fluid">
        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Danh sách phòng</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Danh sách phòng</li>
                    </ol>
                </div>
            </div>
            <!--begin::Row-->
            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/admin/rooms/add}" class="btn btn-primary">+ Thêm phòng mới</a>
                <!--end::Row-->
                <div class="col-md-3">
                    <form th:action="@{/admin/rooms}" method="GET">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập thông tin cần tìm...">
                            <button type="submit" class="btn btn-secondary"><i class="bi bi-search"></i> Tìm kiếm</button>
                            <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/admin/rooms}" class="btn btn-outline-danger">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
        <!--end::Container-->
        <div class="app-content">

            <table class="table table-hover table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên phòng</th>
                    <th>Danh mục</th>
                    <th>Giá (NL/TE)</th>
                    <th>Thời gian(phút)</th>
                    <th>Số lượng người chơi</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${roomPage.empty}">
                    <td colspan="8" class="text-center">
                        Chưa có dữ liệu
                    </td>
                </tr>
                <tr th:each="r : ${roomPage.content}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.name}"></td>
                    <td th:text="${r.category != null ? r.category.name : 'Chưa phân loại'}"></td>
                    <td>
                        <span th:text="${#numbers.formatDecimal(r.priceAdult, 0, 'POINT', 0, 'POINT')}"></span> /
                        <span th:text="${#numbers.formatDecimal(r.priceKid, 0, 'POINT', 0, 'POINT')}"></span>
                    </td>
                    <td th:text="${r.duration}"></td>
                    <td>
                        <span th:text="${r.minPlayers}"></span> -
                        <span th:text="${r.maxPlayers}"></span>
                    </td>
                    <td>
                        <span th:if="${r.active}" class="badge bg-success">Hoạt động</span>
                        <span th:unless="${r.active}" class="badge bg-secondary">Đã ẩn</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/rooms/edit/{id}(id=${r.id})}" class="btn btn-sm btn-warning">Sửa</a>
                        <form th:action="@{/admin/rooms/delete/{id}(id=${r.id})}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Bạn có chắc chắn muốn xóa phòng này?')">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <nav class="mt-3" th:if="${roomPage.totalPages > 0}">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${roomPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rooms(page=${roomPage.number - 1})}">Trước</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, roomPage.totalPages - 1)}"
                        th:classappend="${i == roomPage.number} ? 'active'">
                        <a class="page-link" th:href="@{/admin/rooms(page=${i})}" th:text="${i + 1}"></a>
                    </li>

                    <li class="page-item" th:classappend="${roomPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rooms(page=${roomPage.number + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
