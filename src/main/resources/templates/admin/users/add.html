<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">

    <div class="container-fluid">

        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Thêm người dùng</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item">
                            <a href="/admin/dashboard">Home</a>
                        </li>
                        <li class="breadcrumb-item active">
                            Thêm người dùng
                        </li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="app-content">

            <form th:action="@{/admin/users/add}"
                  th:object="${user}"
                  method="post">

                <div class="mb-3">
                    <label>Username</label>

                    <input type="text"
                           th:field="*{username}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label>Email</label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label>Password</label>

                    <input type="password"
                           th:field="*{password}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label>Role</label>

                    <select th:field="*{role}"
                            class="form-select">

                        <option value="ROLE_USER">
                            User
                        </option>

                        <option value="ROLE_ADMIN">
                            Admin
                        </option>

                    </select>
                </div>

                <div class="text-end">

                    <a th:href="@{/admin/users}" class="btn btn-secondary">
                        Quay lại
                    </a>

                    <button type="submit" class="btn btn-success">
                        Thêm mới
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
</body>
</html>
