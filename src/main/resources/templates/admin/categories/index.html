<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">
    <!--begin::Container-->
    <div class="container-fluid">
        <div class="app-content-header">
            <!--begin::Row-->
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Quản lý danh mục</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Quản lý danh mục</li>
                    </ol>
                </div>
            </div>
            <!--end::Row-->
        </div>
        <!--end::Container-->

        <div class="app-content">
            <div class="col-6">
                <form th:action="@{/admin/categories/add}" method="POST" class="mb-4">
                    <div class="input-group">
                        <input type="text" class="form-control" name="name" placeholder="Tên danh mục" required>
                        <button type="submit" class="btn btn-primary">Thêm</button>
                    </div>
                </form>
            </div>

            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.id}"></td>
                    <td th:text="${cat.name}"></td>
                    <td>
                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-warning">Sửa</a>

                        <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <nav class="mt-3">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${categories.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rooms(page=${categories.number - 1})}">Trước</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, categories.totalPages - 1)}"
                        th:classappend="${i == categories.number} ? 'active'">
                        <a class="page-link" th:href="@{/admin/rooms(page=${i})}" th:text="${i + 1}"></a>
                    </li>

                    <li class="page-item" th:classappend="${categories.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rooms(page=${categories.number + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
