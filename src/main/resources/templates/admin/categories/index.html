<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout(~{:: #content})}">
<body>
<div id="content">
    <div class="container-fluid">
        <div class="app-content-header">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Quản lý danh mục</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Quản lý danh mục</li>
                    </ol>
                </div>
            </div>
        </div>
        <div class="app-content">

            <div class="row mb-4 d-flex justify-content-between">
                <div class="col-md-5">
                    <form th:action="@{/admin/categories/add}" method="POST">
                        <div class="input-group">
                            <input type="text" class="form-control" name="name" placeholder="Tên danh mục mới..." required>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Thêm</button>
                        </div>
                    </form>
                </div>

                <div class="col-md-3">
                    <form th:action="@{/admin/categories}" method="GET">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập tên danh mục cần tìm...">
                            <button type="submit" class="btn btn-secondary"><i class="bi bi-search"></i> Tìm kiếm</button>
                            <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/admin/categories}" class="btn btn-outline-danger">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>

            <table class="table table-bordered table-hover">
                <thead class="table-light">
                <tr>
                    <th style="width: 100px;">ID</th>
                    <th>Tên danh mục</th>
                    <th style="width: 200px;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${categories.empty}">
                    <td colspan="3" class="text-center text-muted py-3">
                        Chưa có dữ liệu danh mục nào tương ứng
                    </td>
                </tr>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.id}"></td>
                    <td th:text="${cat.name}"></td>
                    <td>
                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-warning">Sửa</a>

                        <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <nav class="mt-3" th:if="${categories.totalPages > 0}">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${categories.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/categories(page=${categories.number - 1}, keyword=${keyword})}">Trước</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, categories.totalPages - 1)}"
                        th:classappend="${i == categories.number} ? 'active'">
                        <a class="page-link" th:href="@{/admin/categories(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                    </li>

                    <li class="page-item" th:classappend="${categories.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/categories(page=${categories.number + 1}, keyword=${keyword})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
