<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth-layout :: layout(~{:: #forgotPasswordForm})}">

<body>

<div id="forgotPasswordForm">
    <h3 class="card-title text-center mb-4">Quên Mật Khẩu</h3>
    <p class="text-muted text-center small">Nhập email đã đăng ký để nhận hướng dẫn khôi phục mật khẩu.</p>
    <div class="alert alert-success" th:if="${message}">
        <span th:text="${message}"></span>
    </div>

    <div class="alert alert-danger" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/forgot-password}" method="POST">
        <div class="mb-3">
            <label class="form-label">Địa chỉ Email</label>
            <input type="email" name="email" class="form-control" required placeholder="example@email.com">
        </div>
        <button type="submit" class="btn btn-primary w-100 text-white">Gửi yêu cầu</button>
    </form>

    <p class="text-center mt-3 mb-0">
        <a th:href="@{/login}">Quay lại đăng nhập</a>
    </p>
</div>

</body>
</html>
